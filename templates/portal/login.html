{% extends "layout.html" %}

{% block file %}login-register{% endblock %}

{% block title %}
    Fahdjud Project
{% endblock %}

{% block main %}
<div class="video-background">
    <video autoplay loop muted>
        <source src="{{ url_for('static', filename='images/login-background.mp4') }}" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</div>
<div class="container login-container my-5 ">
    <div class="card login-card mb-3 mx-auto">
        <div class="card-body">
            <h5 class="card-title text-center">Login</h5>
            <form action="{{ url_for('login_template') }}" method="POST" class="text-center justify-content-center py-3 needs-validation" novalidate>
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="floatingInput" name="username" placeholder="Username" required>
                    <label for="floatingInput">Username</label>
                    <div class="invalid-feedback">
                        Please enter a username.
                    </div>
                </div>
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="floatingPassword" name="password" placeholder="Password" required>
                    <label for="floatingPassword">Password</label>
                    <div class="invalid-feedback">
                        Please enter your password.
                    </div>
                </div>
                <div class="py-3">
                    <button type="submit" class="btn btn-success px-5 py-2">Submit</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Example starter JavaScript for disabling form submissions if there are invalid fields
    (function () {
        'use strict'

        // Fetch all the forms we want to apply custom Bootstrap validation styles to
        let forms = document.querySelectorAll('.needs-validation')

        // Loop over them and prevent submission
        Array.prototype.slice.call(forms)
            .forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }

                    form.classList.add('was-validated')
                }, false)
            })
    })()

</script>
{% endblock %}
