{% extends "layout.html" %}
{% block file %}{% endblock %}

{% block title %}
    Dashboard
{% endblock %}

{% block main %}
<div class="video-background">
    <video autoplay loop muted>
        <source src="{{ url_for('static', filename='images/loading.mp4') }}" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</div>
<div class="py-3 my-3">
<div class="container text-center my-5 py-5">
    <form id="upload-form" action="{{ url_for('dashboard_template') }}" method="post" enctype="multipart/form-data">
        <div class="mb-3">
            <label for="formFile" class="form-label">Upload PNG file</label>
            <input class="form-control" type="file" id="formFile" name="file" accept=".png" required>
        </div>
        <button type="submit" class="btn btn-primary" id="uploadButton">Upload</button>
    </form>
    <div id="loading" style="display: none;">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p>Converting your image, please wait...</p>
    </div>
    <div id="home-button" style="display: none;">
        <a href="{{ url_for('index') }}" class="btn btn-secondary">Return Home</a>
    </div>
</div>
</div>
<script>
    document.getElementById('upload-form').addEventListener('submit', function() {
        var loading = document.getElementById('loading');
        loading.style.display = 'block';
    });

    document.getElementById('upload-form').addEventListener('submit', function() {
        var homeButton = document.getElementById('home-button');
        homeButton.style.display = 'block';
    });
</script>
{% endblock %}
